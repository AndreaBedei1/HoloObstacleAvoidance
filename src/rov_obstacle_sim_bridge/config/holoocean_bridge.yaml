# Parameters for the ROS 2 side of the HoloOcean bridge (holoocean_bridge_node).
# This node connects to the holoocean_sim_server over a localhost TCP socket.
# It performs NO HoloOcean import itself (HoloOcean runs in the conda `ocean`
# env, in the separate sim-server process).

holoocean_bridge:
  ros__parameters:
    host: "127.0.0.1"
    port: 47654
    poll_rate_hz: 60.0

    world_frame_id: "world"
    camera_frame_id: "front_camera"

    image_topic: "/camera/front/image_raw"
    # SIMULATION-ONLY ground-truth pose (validation / debug only). The runtime
    # planner consumes /rov/odom_estimated instead (odometry_estimator_node).
    pose_topic: "/rov/pose_ground_truth"
    # BODY-frame velocity + yaw rate (DVL + gyro source for the estimator).
    velocity_topic: "/rov/velocity"
    depth_topic: "/rov/depth"
    # SIMULATION-ONLY ground-truth obstacle projection (debug / labels / eval).
    oracle_topic: "/perception/obstacles_oracle"
    # The bridge consumes the PLANT output, not the planner output. The
    # actuation model sits between them and is an identity pass-through
    # at S0/S1/S2, so this is unchanged behaviour there; at S3 it is what
    # applies the measured saturation, deadband and lag. The validator
    # still observes /planner/cmd_vel_safe, which is the frozen boundary
    # and must stay the planner's own output.
    cmd_vel_topic: "/rov/cmd_vel_plant"

    publish_image: true

    # Oracle projection range gate (metres).
    min_detection_range_m: 0.2
    max_detection_range_m: 40.0
    risk_area_gain: 4.0
