  simulator.frames_per_sec: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml"
  simulator.show_viewport: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml"
  simulator.real_time_pacing: "docs/SCIENTIFIC_DECISIONS.md D-010; src/rov_obstacle_sim_bridge/holoocean_server/holoocean_sim_server.py (high-resolution pacing)"
  simulator.cmd_timeout_s: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml (sim.cmd_timeout_s)"
  simulator.start_offset_m: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml (sim.start_offset)"
  simulator.collision_detection: "docs/SCIENTIFIC_DECISIONS.md D-003 (audit: no collision detection; vehicle can pass through geometry)"
  simulator.water_current: "config/real_pool/pool_mission_profile.yaml no_current_note; no current is configured in any scenario"

  camera.width: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml"
  camera.height: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml"
  camera.horizontal_fov_deg: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml"
  camera.vertical_fov_deg: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml"
  camera.distortion_model: "absent by construction: no distortion is applied anywhere in src/rov_obstacle_sim_bridge/"
  camera.refraction_model: "absent by construction: no air/water interface model exists in the sim path"
  camera.rolling_shutter: "absent by construction: HoloOcean RGBCamera renders a full frame per tick"

  observation.producer: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/holoocean_bridge_node.py::_publish_oracle + oracle_geometry.py"
  observation.boundary_topic: "src/rov_obstacle_sim_bridge/launch/holoocean_baseline0.launch.py (relay output_topic)"
  observation.coordinates: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/oracle_geometry.py (normalized image projection)"
  observation.detection_probability: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/holoocean_bridge_node.py::_publish_oracle - every projected obstacle is published, no miss model exists"
  observation.confidence: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/holoocean_bridge_node.py::_publish_oracle (CameraConfig confidence=1.0)"
  observation.min_detection_range_m: "src/rov_obstacle_sim_bridge/config/holoocean_bridge.yaml"
  observation.max_detection_range_m: "src/rov_obstacle_sim_bridge/config/holoocean_bridge.yaml (40.0; the 10.0 in holoocean_oracle.yaml belongs to the standalone demo path, not the closed loop)"
  observation.risk_area_gain: "src/rov_obstacle_sim_bridge/config/holoocean_bridge.yaml"
  observation.center_x_bias: "absent by construction: no noise is injected between the oracle and /perception/obstacles_raw"
  observation.center_x_noise_std: "absent by construction (see center_x_bias)"
  observation.center_y_bias: "absent by construction (see center_x_bias)"
  observation.center_y_noise_std: "absent by construction (see center_x_bias)"
  observation.log_size_bias: "absent by construction (see center_x_bias)"
  observation.log_size_noise_std: "absent by construction (see center_x_bias)"
  observation.false_positive_rate_hz: "absent by construction: the oracle publishes configured obstacles only"
  observation.class_confusion_prob: "absent by construction: class_name is copied from the scenario YAML"
  observation.occlusion_model: "absent by construction: oracle_geometry.py projects each obstacle independently"
  observation.edge_clip_model: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/oracle_geometry.py"
  observation.detector_gate: "absent by construction: no detector/scoring stage is in the oracle path"

  timing.observation_rate_hz: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/holoocean_bridge_node.py (one oracle array per received sim state) x planner_F0.yaml ticks_per_sec=30"
  timing.observation_rate_source: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/holoocean_bridge_node.py::_publish_state"
