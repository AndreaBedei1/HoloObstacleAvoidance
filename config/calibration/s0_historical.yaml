  timing.arrival_process: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/holoocean_bridge_node.py"
  timing.stamp_source: "docs/SCIENTIFIC_DECISIONS.md D-003 (stamps applied at publish time; image stamps discarded)"
  timing.bridge_poll_rate_hz: "src/rov_obstacle_sim_bridge/config/holoocean_bridge.yaml"
  timing.estimator_output_rate_hz: "src/rov_obstacle_tracking/rov_obstacle_tracking/temporal_estimator_node.py (output_rate_hz default)"
  timing.burst_dropout: "src/rov_obstacle_sim_bridge/rov_obstacle_sim_bridge/oracle_dropout_relay_node.py defaults; disabled by default in src/rov_obstacle_sim_bridge/launch/holoocean_baseline0.launch.py"

  vehicle.axis_sign_convention: "src/rov_obstacle_sim_bridge/holoocean_server/bluerov2_dynamics.py (client/ROS body frame: x fwd, y LEFT, z up)"
  vehicle.limits: "src/rov_obstacle_sim_bridge/config/holoocean_scenarios/planner_F0.yaml (limits block)"
