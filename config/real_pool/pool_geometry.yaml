# Real pool survey — measured 2026-08-13 from the overhead RealSense D435
# (read-only capture; scripts/measure_pool_geometry.py +
# scripts/verify_pool_depths.py; raw data in
# visualizations/pool_setup_20260812/).
#
# Pool frame: origin = left-end waterline, X = along-pool toward the right
# end, Y = toward the FAR rim (top of the camera image), Z = up (surface
# normal). Units: meters.

pool:
  total_length_m: 6.0          # operator; camera sees 5.59 m (right end
                               # extends slightly beyond the frame edge)
  visible_length_m: 5.594      # measured (left waterline -> right frame edge)
  width_at_rod_m: 2.662        # measured rim-to-rim
  width_left_m: 3.051          # measured (pool slightly wider left)

rod_and_anchor:
  rod_along_x_m: 3.92          # measured; left segment 3.92 m, right ~2.1 m
  anchor_suspension_xy_m: [3.92, 0.07]   # 7 cm toward the FAR rim
  anchor_touches_bottom: true  # operator: nearly touches at ~1.3 m depth
  anchor_height_m: 0.80        # operator estimate 2026-08-13; to be
                               # refined with the drone camera. H_ref of
                               # the monocular model for BOTH planners.
  anchor_width_base_m: 0.80    # operator estimate: 0.80 only at the LOWEST
                               # part (flukes); the shank above is much
                               # thinner. Tapered shape — width at the
                               # vehicle transit depth NOT yet measured:
                               # drone-camera imaging tomorrow. Planning
                               # radius stays 0.40 (widest part,
                               # CONSERVATIVE) until then.

water_depths:
  # operator tape values + refraction-corrected stereo cross-check
  # (apparent*1.333 vs surface plane fit, rim residual 0.013 m)
  left_zone_m:   {tape: 0.60, camera_crosscheck: 0.567}
  anchor_zone_m: {tape: 1.30, camera_crosscheck: 1.221}
  right_zone_m:
    tape: 0.80
    camera_crosscheck: 1.292   # DISCREPANCY: the visible right zone is
                               # still deep basin; the 0.80 m shelf lies
                               # at/just beyond the right frame edge.
                               # TODO(Andrea): confirm where the bottom
                               # rises to 0.80 m (x >= ~5.5 m).
  # bottom profile along X (apparent-corrected samples):
  # x~1.8: 0.46-0.57 | x~3.3: 1.2-1.3 | x~4.8: ~1.3 | x~5.5: ~1.08 rising

external_camera:
  model: Intel RealSense D435 (serial in realsense_inventory.json)
  rgb_stream: 1920x1080 @ 28.6 fps measured, BGR8
  depth_stream: 848x480 z16, depth_scale 0.001, aligned to color
  timestamp_domain: system_time
  height_above_surface_m: ~3.7   # plane offset at optical center
  # Rigid transform camera -> pool frame (rows = pool axes expressed in
  # camera coordinates; p_pool = R @ (p_cam - t)):
  t_pool_origin_in_camera: [-3.015, -0.075, 4.621]
  R_rows_pool_axes_in_camera:
    x_along_pool: [0.9560, 0.0381, -0.2908]
    y_toward_far_rim: [-0.0154, -0.9837, -0.1793]
    z_up: [-0.2928, 0.1759, -0.9398]
  surface_plane_camera_z_eq: [-0.31158, 0.18715, 3.6786]  # z = ax+by+c
  anchor_suspension_pixel_rgb: [1268, 540]
  notes: >
    Underwater stereo returns are refraction-biased (divide-by-n
    correction applied only in the cross-check); use this camera for
    ABOVE-water ground truth (vehicle surfaced position, rod, rims) and
    for refraction-corrected bottom checks, never as a control input.
