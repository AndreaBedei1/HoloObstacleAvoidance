# Real-pool mission profile — PROPOSED (D-014 draft, NOT frozen).
# Derived from config/real_pool/pool_geometry.yaml (survey 2026-08-13) and
# the Phase-8 K-series findings (docs/PHASE8_DWA_RESULTS.md Q9).
# NOTHING here authorizes actuation: the rov_real_bridge interlock keeps
# vehicle_in_water:=false AND allow_real_actuation:=false until Andrea
# explicitly sets both. No arming, no thruster test, Ping-1D only after
# in-water confirmation. The imaging sonar remains prohibited.

route:
  # Along-pool centerline, left -> right. The left 0.6 m-deep shelf cannot
  # accommodate the vehicle at maneuvering depth (see vertical_envelope):
  # start the run at x >= 2.3 m where the bottom has dropped past ~0.9 m.
  start_x_m: 2.3
  end_x_m: 5.5            # before the right-end shallow shelf (TBC 0.80 m)
  usable_route_length_m: 3.2
  obstacle_x_m: 3.92      # anchor plane (survey)
  detection_run_up_m: 1.6 # start -> anchor: adequate for T2 warm-up
                          # (~1.0 s) + confirmation at 0.12 m/s

speeds:
  nominal_surge_ms: 0.12  # pool profile (K-series used 0.15; slower here
                          # because the usable route is 3.2 m, not 6)
  max_surge_ms: 0.25
  max_sway_ms: 0.15
  max_yaw_rate_rads: 0.3

vertical_envelope:
  # BlueROV2 Heavy height ~0.37 m (0.40 conservative). CONFIRMED
  # 2026-08-14: the pressure sensor sits at the BOTTOM of the frame
  # (reads 0.45 m when floating with the top at the surface), so depth
  # setpoints are KEEL depths: vehicle spans [setpoint-0.45, setpoint],
  # camera ~= setpoint-0.2. Bottom profile from the survey.
  segments:
    - {x_range_m: [0.0, 2.0], water_m: 0.57-0.8, note: "NO-GO at depth:
        keel clearance < 0.1 m; surface transit only"}
    - {x_range_m: [2.3, 5.0], water_m: 1.2-1.3, depth_setpoint_m: 0.55,
        keel_m: 0.55, bottom_clearance_m: ~0.7, camera_depth_m: ~0.35}
    - {x_range_m: [5.0, 6.0], water_m: rising to ~0.8 (TBC),
        depth_setpoint_m: 0.25, note: "end-of-run zone; stop before the
        shelf until the 0.80 m line is confirmed"}
  depth_setpoint_mission_m: 0.55
  # Rationale (anchor 0.80 m tall, bottom at 1.22-1.30 m): anchor spans
  # ~0.45-1.25 m of depth, so at 0.55 m the vehicle center is BELOW the
  # anchor top — a genuine frontal collision course requiring the lateral
  # avoidance under study, with the anchor centered in the camera FOV.
  # Passing OVER the anchor is NOT an escape the planners can take
  # (horizontal-only control), which keeps the real trial faithful to
  # the sim formulation.

obstacle_class:
  name: anchor_real
  target_obstacle_height_m: 0.80   # operator estimate (refine with drone
                                   # camera); H_ref applied IDENTICALLY to
                                   # both planners.
  obstacle_radius_m: 0.40          # CONSERVATIVE: half of the 0.80 m BASE
                                   # width (flukes). The anchor tapers —
                                   # the width at the 0.55 m transit depth
                                   # is likely smaller, but it stays 0.40
                                   # until measured with the drone camera
                                   # (no speculative narrowing).
  # Engagement geometry at mission depth 0.55 m: anchor spans ~0.45-1.25 m
  # of depth (0.80 tall, bottom at 1.22-1.30) -> dead ahead of the camera;
  # bbox height fraction ~0.25 at the 1.6 m detection run-up (VFOV 90),
  # edge-clip guard relevant inside ~0.9 m.

lateral_budget:
  # Width at the anchor 2.662 m; suspension +0.07 m toward the far rim.
  # With the 0.80 m anchor the free-water corridor is (1.399 - 0.40) ~
  # 1.0 m on the near side. The sim-circumscribed vehicle radius (0.40)
  # closes the corridor entirely: hull-center window [0.40+0.40+margin,
  # 1.399-0.40-wall] is EMPTY for any margin >= 0.1. The pool profile
  # therefore uses an ORIENTATION-AWARE footprint: the DWA holds yaw ~ 0
  # during sway passes, so the transverse half-width governs
  # (0.457/2 = 0.229 m) + 0.05 m allowance -> 0.28 m.
  half_width_near_side_m: 1.399   # anchor center -> near rim
  half_width_far_side_m: 1.263
  anchor_radius_m: 0.40
  vehicle_halfwidth_planning_m: 0.28
  wall_standoff_m: 0.10
  hull_center_window_from_anchor_m: [0.83, 1.02]  # with margin 0.15
  pass_center_m: 0.92             # physical clearances ~0.29 anchor side,
                                  # ~0.25 wall side
  preferred_side: near_rim        # +7 cm extra gap; depths equal L/R of rod
  recommendation: >
    The corridor numbers above use the CONSERVATIVE base width (0.80 m).
    The anchor tapers: at the 0.55 m transit depth the true width is
    likely well under 0.80, which would relax the whole budget — measure
    it tomorrow with the drone camera BEFORE freezing D-014; do not relax
    any number on assumption. Independent easing option: shifting the
    suspension 0.3-0.4 m toward the far rim widens the corridor to
    ~1.4 m. Decision is Andrea's.

planner_pool_profile:
  # DWA (Planner D) — proposed pool overrides (D-013 stays frozen for sim;
  # these are the REAL-POOL profile to be frozen as D-014 before any run):
  dwa:
    vehicle_radius_m: 0.28        # orientation-aware footprint (see
                                  # lateral_budget); sim keeps 0.40
    safety_margin_m: 0.15         # corridor-constrained (see budget);
                                  # slow speed 0.12 m/s compensates
    clearance_saturation_m: 0.8
    goal_lookahead_m: 2.0
    horizon_s: 6.0
    weights: {w_clearance: 0.5, w_progress: 1.0, w_speed: 0.3,
              w_route: 0.5, w_smooth: 0.1}
  # Committed (Planner C): Phase-8 K1 finding — the image-space engagement
  # threshold tuned on the 3.5 m class NEVER engaged the 0.5 m pool class
  # and grazed at 0.10 m from contact. With H_ref now 0.80 the range model
  # is configured; the remaining engagement thresholds (commit distance,
  # bbox gates) get calibrated tomorrow against REAL drone-camera images
  # of the anchor before any wet run.
  committed:
    engagement_rescale_required: true
    target_obstacle_height_m: 0.80

safety_gates:
  vehicle_in_water: false          # Andrea sets true ONLY with ROV in pool
  allow_real_actuation: false      # both must be true for any command
  arming: "NEVER by Claude; operator-only"
  abort_conditions:
    - depth > 0.85 m (hard floor margin in the 1.2 m basin)
    - lateral position beyond |y| = 1.1 m (wall proximity)
    - loss of external-camera GT or tether telemetry
